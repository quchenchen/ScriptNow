server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;

    # Creator SPA (default)
    location / {
        root /app/static/creator;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin SPA
    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }

    # Admin API must be matched before the Admin SPA. Preserve the
    # /admin/api prefix because FastAPI registers these routes verbatim.
    location ^~ /admin/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location ^~ /admin/ {
        root /app/static;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Generated covers and other backend-served media (StaticFiles mount).
    # Must be matched before the Creator SPA fallback.
    location ^~ /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # API proxy to uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Health check direct
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}
