schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: ..

engine:
  name: claude_code
  model:
    provider: deepseek
    name: deepseek-v4-flash

cases:
  files:
    - evals/cases/case-review-sensory.yaml
    - evals/cases/case-review-drama.yaml
  defaults:
    timeout_seconds: 120
    max_turns: 3
  parallelism: 1

report:
  formats: [json]
  artifacts:
    - transcript
