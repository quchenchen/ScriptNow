id: no-ai-labels
title: Anti-AI labeling verification
description: Scene opening must avoid AI-sounding labels and use concrete sensory anchors
tag: quality
input:
  prompt: |
    Write a scene opening (~200 words) for a Chinese vertical short drama.
    Genre: 都市悬疑. Setting: a rooftop at midnight.
    Two characters: a CEO who just discovered his partner betrayed him,
    and the partner who doesn't know he's been caught.
    
    Rules:
    - No AI-labeling phrases: 值得注意的是, 此外, 标志着, 关键转折点, 让人意识到, 显而易见, 综上所述, 总而言之
    - Use at least 2 concrete sensory details (sound, light, temperature, touch, smell)
    - Characters express emotion through action, not through narratorial description
    - Avoid emotional labels like "他感到愤怒", "气氛紧张"
constraints:
  timeout_seconds: 90
  max_turns: 3
expect:
  must_contain:
    - "。"
judge:
  type: agent_judge
  model: deepseek-v4-flash
  criteria:
    - "No Chinese AI-labeling phrases present (值得注意的是, 此外, 标志着, 关键转折点, 让人意识到, 显而易见, 综上所述, 总而言之)"
    - "At least 2 concrete sensory details from different channels (sound/light/temperature/touch/smell)"
    - "Characters express emotion through physical action or dialogue, not through narrated emotional labels"
  pass_threshold: 0.7
