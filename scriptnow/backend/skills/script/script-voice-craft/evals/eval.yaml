schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: ..

engine:
  name: codex
  model:
    provider: deepseek
    name: deepseek-v4-flash

cases:
  files:
    - evals/cases/no-ai-labels.yaml
    - evals/cases/dialogue-naturalness.yaml
  defaults:
    timeout_seconds: 120
    max_turns: 3
  parallelism: 1

report:
  formats: [json]
  artifacts:
    - transcript
