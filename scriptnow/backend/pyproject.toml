[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptnow"
version = "0.2.0-rc.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.19",
  "agentscope==2.0.4",
  "sqlalchemy==2.0.51",
  "aiosqlite==0.22.1",
  "alembic==1.18.5",
  "PyJWT==2.10.1",
  "cryptography==49.0.0",
  "httpx==0.28.1",
  "opentelemetry-sdk==1.43.0",
  "opentelemetry-exporter-otlp==1.43.0",
  "python-docx==1.1.2",
  "pypdf==5.9.0",
  "json-repair==0.61.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0", "httpx==0.28.1", "ruff==0.8.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
