[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptflow-backend"
version = "0.5.0"
description = "ScriptFlow — 让好剧本长出来的 AI Agent 团队协作平台（后端）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Pinned exactly. If bumping, update lockfile and re-test.
dependencies = [
    # Web
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.19",

    # Data
    "sqlalchemy==2.0.51",
    "aiosqlite==0.22.1",
    "alembic==1.18.5",

    # Auth
    "pyjwt==2.10.1",

    # LLM / Agent
    "agentscope==2.0.4",
    "dashscope==1.26.3",
    "openai==1.107.0",

    # Utility
    "python-frontmatter==1.3.0",
    "pydantic-settings==2.10.1",

    # Export
    "python-docx==1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — 让格式器决定
    "B008",   # do not perform function calls in argument defaults — FastAPI Depends() 常用
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]  # 测试里的 pytest fixture 等
