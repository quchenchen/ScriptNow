        lineage: { rail: &#x27;Branch / Revision&#x27;, title: &#x27;版本与血缘&#x27;, kicker: &#x27;GROWTH TREE · 当前对象 EP01&#x27;, crumb: &#x27;Idea A → Story Core v2 → Beat 02 → EP01 v3&#x27;, railBody: &#x27;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row is-active&quot;&gt;&lt;i data-lucide=&quot;circle-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;当前 Branch&lt;/span&gt;&lt;span&gt;v3&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;节奏强化&lt;/span&gt;&lt;span&gt;候选&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row&quot;&gt;&lt;i data-lucide=&quot;history&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Revision 历史&lt;/span&gt;&lt;span&gt;5&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row&quot;&gt;&lt;i data-lucide=&quot;triangle-alert&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;受影响内容&lt;/span&gt;&lt;span class=&quot;sf-dirty&quot;&gt;2&lt;/span&gt;&lt;/button&gt;&#x27;, body: &#x27;&lt;svg class=&quot;sf-lineage-map&quot; viewBox=&quot;0 0 720 350&quot; role=&quot;img&quot; aria-label=&quot;雾港来信 EP01 的版本血缘&quot;&gt;&lt;title&gt;EP01 版本血缘&lt;/title&gt;&lt;path d=&quot;M140 175 H260 M390 175 H505 M390 175 C445 175 445 275 505 275&quot;/&gt;&lt;path d=&quot;M325 110 V145&quot;/&gt;&lt;rect class=&quot;sf-node&quot; x=&quot;20&quot; y=&quot;140&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;sf-node&quot; x=&quot;260&quot; y=&quot;140&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;sf-node&quot; x=&quot;260&quot; y=&quot;35&quot; width=&quot;130&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;sf-node sf-node-current&quot; x=&quot;505&quot; y=&quot;140&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;sf-node&quot; x=&quot;505&quot; y=&quot;245&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;原著第 2–3 章&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; opacity=&quot;.6&quot;&gt;Source Canon&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;Beat 02&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; opacity=&quot;.6&quot;&gt;Story Core v2&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot;&gt;林夏&lt;/text&gt;&lt;text x=&quot;325&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; opacity=&quot;.6&quot;&gt;Character v2&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;EP01 · 当前采用&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; opacity=&quot;.6&quot;&gt;Revision v3&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;275&quot; text-anchor=&quot;middle&quot;&gt;节奏强化 Branch&lt;/text&gt;&lt;text x=&quot;590&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; opacity=&quot;.6&quot;&gt;候选&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;sf-document-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;sf-button&quot;&gt;比较两个 Branch&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-button&quot;&gt;预览 Cascade 影响&lt;/button&gt;&lt;/div&gt;&#x27; },
        export: { rail: &#x27;导出范围&#x27;, title: &#x27;导出交付&#x27;, kicker: &#x27;EXPORT · 当前采用 Branch&#x27;, crumb: &#x27;导出 → DOCX · 标准剧本纸&#x27;, railBody: &#x27;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row is-active&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;剧本 DOCX&lt;/span&gt;&lt;span&gt;推荐&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row&quot;&gt;&lt;i data-lucide=&quot;braces&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;资产 JSON&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row&quot;&gt;&lt;i data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;视频提示词&lt;/span&gt;&lt;span&gt;后续&lt;/span&gt;&lt;/button&gt;&#x27;, body: &#x27;&lt;div class=&quot;sf-export-view&quot;&gt;&lt;h2&gt;选择导出范围&lt;/h2&gt;&lt;div class=&quot;sf-export-option&quot;&gt;&lt;input id=&quot;range-current&quot; type=&quot;radio&quot; name=&quot;export_range&quot; checked&gt;&lt;label for=&quot;range-current&quot;&gt;&lt;strong&gt;当前采用内容&lt;/strong&gt;&lt;span&gt;EP01–EP03 · 3 集 · 当前 Branch v3&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;sf-export-option&quot;&gt;&lt;input id=&quot;range-complete&quot; type=&quot;radio&quot; name=&quot;export_range&quot;&gt;&lt;label for=&quot;range-complete&quot;&gt;&lt;strong&gt;全部已完成内容&lt;/strong&gt;&lt;span&gt;只包含状态为“完成”的 Episode&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;sf-export-option&quot;&gt;&lt;input id=&quot;range-select&quot; type=&quot;radio&quot; name=&quot;export_range&quot;&gt;&lt;label for=&quot;range-select&quot;&gt;&lt;strong&gt;自定义范围&lt;/strong&gt;&lt;span&gt;选择 Episode、Scene 与 Revision&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;sf-decision&quot;&gt;&lt;span class=&quot;sf-kicker&quot;&gt;导出前检查&lt;/span&gt;&lt;p&gt;剧本格式通过 · 1 个来源警告不会阻止导出。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;sf-button sf-button-primary&quot;&gt;生成 DOCX&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27; }
      };

      function refreshIcons() {
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.querySelector(&#x27;span&#x27;).textContent = message;
        toast.hidden = false;
        toastTimer = window.setTimeout(() =&gt; { toast.hidden = true; }, 2200);
      }

      function showDashboard() {
        dashboard.hidden = false;
        workspace.hidden = true;
        app.dataset.view = &#x27;dashboard&#x27;;
      }

      function showWorkspace(novel = false) {
        dashboard.hidden = true;
        workspace.hidden = false;
        app.dataset.view = &#x27;workspace&#x27;;
        projectName.textContent = novel ? &#x27;未眠之城&#x27; : &#x27;雾港来信&#x27;;
        projectKind.textContent = novel ? &#x27;原创 · 小说&#x27; : &#x27;小说改编 · 剧本&#x27;;
        selectSpace(&#x27;write&#x27;, novel);
      }

      function selectSpace(key, novel = false) {
        const view = spaceViews[key];
        if (!view) return;
        root.querySelectorAll(&#x27;[data-space]&#x27;).forEach((button) =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.space === key));
        railTitle.textContent = view.rail;
        railContent.innerHTML = novel &amp;&amp; key === &#x27;write&#x27; ? &#x27;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row is-active&quot;&gt;&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;第一卷 · 未眠&lt;/span&gt;&lt;span&gt;8 章&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row sf-indent&quot;&gt;&lt;span class=&quot;sf-line&quot;&gt;&lt;/span&gt;&lt;span&gt;第 8 章 · 雨停以前&lt;/span&gt;&lt;span class=&quot;sf-check&quot;&gt;✓&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-tree-row sf-indent&quot;&gt;&lt;span class=&quot;sf-line&quot;&gt;&lt;/span&gt;&lt;span&gt;第 9 章 · 地下车站&lt;/span&gt;&lt;span&gt;草稿&lt;/span&gt;&lt;/button&gt;&#x27; : view.railBody;
        documentTitle.textContent = novel &amp;&amp; key === &#x27;write&#x27; ? &#x27;雨停以前&#x27; : view.title;
        documentKicker.textContent = novel &amp;&amp; key === &#x27;write&#x27; ? &#x27;CHAPTER 08 · POV 林夏 · 当前采用 v2&#x27; : view.kicker;
        breadcrumb.innerHTML = &#x27;&lt;span&gt;&#x27; + (novel &amp;&amp; key === &#x27;write&#x27; ? &#x27;第一卷 → Chapter 08&#x27; : view.crumb) + &#x27;&lt;/span&gt;&#x27;;
        canvas.innerHTML = novel &amp;&amp; key === &#x27;write&#x27; ? &#x27;&lt;article class=&quot;sf-script-page&quot;&gt;&lt;label class=&quot;sf-scene-heading&quot; for=&quot;sf-novel-editor&quot;&gt;第 8 章 · 雨停以前&lt;/label&gt;&lt;textarea id=&quot;sf-novel-editor&quot; name=&quot;novel_content&quot; autocomplete=&quot;off&quot; rows=&quot;14&quot;&gt;凌晨四点，城市终于有了睡意。\n\n林夏沿着最后一班停运的地铁线往回走。雨水从站口的玻璃棚落下来，一滴接着一滴，像有人在耐心敲门。&lt;/textarea&gt;&lt;div class=&quot;sf-selection-tools&quot;&gt;&lt;button type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;wand-sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;改写选段&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;保持 POV&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;调整节奏&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;&#x27; : view.body;
        nextStep.textContent = key === &#x27;review&#x27; ? &#x27;决定是否采用审稿人的 3 处修改&#x27; : key === &#x27;lineage&#x27; ? &#x27;比较当前版本与节奏强化 Branch&#x27; : key === &#x27;export&#x27; ? &#x27;处理 1 个来源警告后导出&#x27; : &#x27;继续完善当前正文&#x27;;
        refreshIcons();
      }

      function openLayer(layer) {
        lastFocus = document.activeElement;
        layer.hidden = false;
        const focusable = layer.querySelector(&#x27;button, input, textarea&#x27;);
        if (focusable) focusable.focus();
      }

      function renderCreateStep(step) {
        createStep = step;
        const isAdaptation = selectedGoal.includes(&#x27;改编&#x27;);
        const isNovel = selectedGoal.includes(&#x27;小说&#x27;);
        if (step === 1) {
          createTitle.textContent = &#x27;你想让故事长成什么？&#x27;;
          createBody.className = &#x27;sf-goal-grid&#x27;;
          createBody.innerHTML = originalCreateBody;
          createFoot.innerHTML = originalCreateFoot;
          const chosen = createBody.querySelector(&#x27;[data-goal=&quot;&#x27; + selectedGoal + &#x27;&quot;]&#x27;);
          if (chosen) { createBody.querySelectorAll(&#x27;[data-goal]&#x27;).forEach((item) =&gt; item.classList.toggle(&#x27;is-selected&#x27;, item === chosen)); }
          createFoot.querySelector(&#x27;#sf-selected-goal&#x27;).textContent = &#x27;已选择：&#x27; + selectedGoal;
        }
        if (step === 2) {
          createTitle.textContent = isAdaptation ? &#x27;提供你有权使用的原作&#x27; : &#x27;从哪里开始这次创作？&#x27;;
          createBody.className = &#x27;sf-create-form&#x27;;
          createBody.innerHTML = isAdaptation ? &#x27;&lt;div class=&quot;sf-field&quot;&gt;&lt;label for=&quot;sf-source-title&quot;&gt;原作名称&lt;/label&gt;&lt;input id=&quot;sf-source-title&quot; name=&quot;source_title&quot; autocomplete=&quot;off&quot; placeholder=&quot;例如：《雾港来信》…&quot;&gt;&lt;/div&gt;&lt;div class=&quot;sf-field&quot;&gt;&lt;label for=&quot;sf-source-file&quot;&gt;Source Canon&lt;/label&gt;&lt;div class=&quot;sf-upload-zone&quot;&gt;&lt;input id=&quot;sf-source-file&quot; name=&quot;source_file&quot; type=&quot;file&quot; aria-describedby=&quot;sf-source-help&quot;&gt;&lt;p id=&quot;sf-source-help&quot;&gt;支持 TXT、DOCX、PDF · 单个文件不超过 20 MB&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;label class=&quot;sf-export-option&quot; for=&quot;sf-rights&quot;&gt;&lt;input id=&quot;sf-rights&quot; name=&quot;rights_confirmed&quot; type=&quot;checkbox&quot;&gt;&lt;span&gt;我确认拥有该作品的使用或改编权&lt;/span&gt;&lt;/label&gt;&#x27; : &#x27;&lt;fieldset class=&quot;sf-field&quot;&gt;&lt;legend&gt;起点成熟度&lt;/legend&gt;&lt;div class=&quot;sf-choice-row&quot;&gt;&lt;label for=&quot;seed-theme&quot;&gt;&lt;input id=&quot;seed-theme&quot; type=&quot;radio&quot; name=&quot;seed_level&quot; value=&quot;theme&quot;&gt;只有主题&lt;/label&gt;&lt;label for=&quot;seed-pitch&quot;&gt;&lt;input id=&quot;seed-pitch&quot; type=&quot;radio&quot; name=&quot;seed_level&quot; value=&quot;pitch&quot; checked&gt;一句话灵感&lt;/label&gt;&lt;label for=&quot;seed-synopsis&quot;&gt;&lt;input id=&quot;seed-synopsis&quot; type=&quot;radio&quot; name=&quot;seed_level&quot; value=&quot;synopsis&quot;&gt;已有梗概&lt;/label&gt;&lt;label for=&quot;seed-outline&quot;&gt;&lt;input id=&quot;seed-outline&quot; type=&quot;radio&quot; name=&quot;seed_level&quot; value=&quot;outline&quot;&gt;已有大纲&lt;/label&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;div class=&quot;sf-field&quot;&gt;&lt;label for=&quot;sf-seed&quot;&gt;创作种子&lt;/label&gt;&lt;textarea id=&quot;sf-seed&quot; name=&quot;seed&quot; autocomplete=&quot;off&quot; rows=&quot;5&quot; placeholder=&quot;例如：一个失踪多年的哥哥，给妹妹寄来一封今天才盖邮戳的信…&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&#x27;;
          createFoot.innerHTML = &#x27;&lt;button type=&quot;button&quot; class=&quot;sf-button&quot; data-action=&quot;create-back&quot;&gt;返回选择&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-button sf-button-primary&quot; data-action=&quot;create-next&quot;&gt;定义创作方向 &lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&#x27;;
        }
        if (step === 3) {
          createTitle.textContent = &#x27;定义这部作品的方向&#x27;;
          createBody.className = &#x27;sf-create-form&#x27;;
          createBody.innerHTML = &#x27;&lt;div class=&quot;sf-field&quot;&gt;&lt;label for=&quot;sf-new-title&quot;&gt;项目名称&lt;/label&gt;&lt;input id=&quot;sf-new-title&quot; name=&quot;title&quot; autocomplete=&quot;off&quot; placeholder=&quot;给作品一个暂定名称…&quot;&gt;&lt;/div&gt;&lt;div class=&quot;sf-field&quot;&gt;&lt;label for=&quot;sf-genre&quot;&gt;题材&lt;/label&gt;&lt;select id=&quot;sf-genre&quot; name=&quot;genre&quot; autocomplete=&quot;off&quot;&gt;&lt;option&gt;悬疑&lt;/option&gt;&lt;option&gt;都市&lt;/option&gt;&lt;option&gt;爱情&lt;/option&gt;&lt;option&gt;科幻&lt;/option&gt;&lt;option&gt;古装&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;sf-field&quot;&gt;&lt;label for=&quot;sf-audience&quot;&gt;目标读者 / 观众&lt;/label&gt;&lt;input id=&quot;sf-audience&quot; name=&quot;audience&quot; autocomplete=&quot;off&quot; placeholder=&quot;例如：18–30 岁女性观众…&quot;&gt;&lt;/div&gt;&lt;fieldset class=&quot;sf-field&quot;&gt;&lt;legend&gt;风格起点&lt;/legend&gt;&lt;div class=&quot;sf-choice-row&quot;&gt;&lt;label for=&quot;style-mine&quot;&gt;&lt;input id=&quot;style-mine&quot; type=&quot;radio&quot; name=&quot;style&quot; checked&gt;复用我的风格&lt;/label&gt;&lt;label for=&quot;style-zero&quot;&gt;&lt;input id=&quot;style-zero&quot; type=&quot;radio&quot; name=&quot;style&quot;&gt;从零开始&lt;/label&gt;&lt;/div&gt;&lt;/fieldset&gt;&#x27;;
          createFoot.innerHTML = &#x27;&lt;button type=&quot;button&quot; class=&quot;sf-button&quot; data-action=&quot;create-back&quot;&gt;返回起点&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-button sf-button-primary&quot; data-action=&quot;create-next&quot;&gt;确认创作计划 &lt;i data-lucide=&quot;arrow-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&#x27;;
        }
        if (step === 4) {
          createTitle.textContent = &#x27;准备让故事开始生长&#x27;;
          createBody.className = &#x27;sf-create-summary&#x27;;
          createBody.innerHTML = &#x27;&lt;div class=&quot;sf-summary-row&quot;&gt;&lt;span&gt;创作目标&lt;/span&gt;&lt;strong&gt;&#x27; + selectedGoal + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;sf-summary-row&quot;&gt;&lt;span&gt;起点&lt;/span&gt;&lt;strong&gt;&#x27; + (isAdaptation ? &#x27;Source Canon&#x27; : &#x27;一句话灵感&#x27;) + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;sf-summary-row&quot;&gt;&lt;span&gt;交付结构&lt;/span&gt;&lt;strong&gt;&#x27; + (isNovel ? &#x27;Volume / Chapter&#x27; : &#x27;Episode / Scene&#x27;) + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;sf-summary-row&quot;&gt;&lt;span&gt;首个团队任务&lt;/span&gt;&lt;strong&gt;&#x27; + (isAdaptation ? &#x27;改编策划师解析来源并生成 Adaptation Map&#x27; : &#x27;创意总监生成 3 个差异化候选&#x27;) + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;sf-lead&quot;&gt;Agent 会先提交候选，不会替你自动采用方向。&lt;/p&gt;&#x27;;
          createFoot.innerHTML = &#x27;&lt;button type=&quot;button&quot; class=&quot;sf-button&quot; data-action=&quot;create-back&quot;&gt;返回修改&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;sf-button sf-button-primary&quot; data-action=&quot;create-finish&quot;&gt;创建并启动团队&lt;/button&gt;&#x27;;
        }
        root.querySelector(&#x27;.sf-modal-head .sf-kicker&#x27;).textContent = &#x27;新建创作 · &#x27; + step + &#x27; / 4&#x27;;
        refreshIcons();
        const firstField = createBody.querySelector(&#x27;input:not([type=&quot;radio&quot;]):not([type=&quot;checkbox&quot;]), textarea, select&#x27;);
        if (firstField &amp;&amp; window.matchMedia(&#x27;(min-width: 681px)&#x27;).matches) firstField.focus();
      }

      function closeLayer(layer) {
        layer.hidden = true;
        if (lastFocus &amp;&amp; typeof lastFocus.focus === &#x27;function&#x27;) lastFocus.focus();
      }

      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const target = event.target.closest(&#x27;button&#x27;);
        if (!target) return;
        const action = target.dataset.action;
        if (action === &#x27;dashboard&#x27;) showDashboard();
        if (action === &#x27;workspace&#x27;) showWorkspace(false);
        if (action === &#x27;workspace-novel&#x27;) showWorkspace(true);
        if (action === &#x27;open-create&#x27;) { renderCreateStep(1); openLayer(createModal); }
        if (action === &#x27;close-create&#x27;) closeLayer(createModal);
        if (action === &#x27;create-next&#x27;) renderCreateStep(Math.min(4, createStep + 1));
        if (action === &#x27;create-back&#x27;) renderCreateStep(Math.max(1, createStep - 1));
        if (action === &#x27;create-finish&#x27;) { closeLayer(createModal); showToast(&#x27;项目已创建，创意总监开始工作&#x27;); window.setTimeout(() =&gt; showWorkspace(selectedGoal.includes(&#x27;小说&#x27;) &amp;&amp; !selectedGoal.includes(&#x27;剧本&#x27;)), 500); }
        if (action === &#x27;show-diff&#x27;) openLayer(diffDrawer);
        if (action === &#x27;close-diff&#x27;) closeLayer(diffDrawer);
        if (action === &#x27;accept-diff&#x27;) { closeLayer(diffDrawer); saveState.innerHTML = &#x27;&lt;span class=&quot;sf-status-dot sf-live&quot;&gt;&lt;/span&gt;已采用 v4&#x27;; showToast(&#x27;已接受 3 处修改，并保留 v3&#x27;); }
        if (action === &#x27;rewrite&#x27; || action === &#x27;tone&#x27; || action === &#x27;source&#x27;) showToast(&#x27;已创建候选 Revision，不会覆盖当前版本&#x27;);
        if (target.dataset.space) selectSpace(target.dataset.space, projectKind.textContent.includes(&#x27;小说&#x27;) &amp;&amp; !projectKind.textContent.includes(&#x27;剧本&#x27;));
        if (target.dataset.spaceJump) selectSpace(target.dataset.spaceJump, false);
        if (target.dataset.goal) {
          selectedGoal = target.dataset.goal;
          root.querySelectorAll(&#x27;[data-goal]&#x27;).forEach((button) =&gt; button.classList.toggle(&#x27;is-selected&#x27;, button === target));
          root.querySelector(&#x27;#sf-selected-goal&#x27;).textContent = &#x27;已选择：&#x27; + target.dataset.goal;
        }
        if (target.dataset.unit) {
          root.querySelectorAll(&#x27;[data-unit]&#x27;).forEach((button) =&gt; button.classList.toggle(&#x27;is-active&#x27;, button === target));
          if (target.dataset.unit === &#x27;scene2&#x27;) { documentTitle.textContent = &#x27;仓库&#x27;; documentKicker.textContent = &#x27;SCENE 02 · DIRTY · 受 Character v3 影响&#x27;; }
        }
      });

      root.addEventListener(&#x27;input&#x27;, (event) =&gt; {
        if (event.target.matches(&#x27;textarea&#x27;)) {
          saveState.textContent = &#x27;保存中…&#x27;;
          window.clearTimeout(root._saveTimer);
          root._saveTimer = window.setTimeout(() =&gt; { saveState.innerHTML = &#x27;&lt;span class=&quot;sf-status-dot sf-live&quot;&gt;&lt;/span&gt;已保存&#x27;; }, 700);
        }
      });

      root.querySelector(&#x27;#sf-command-form&#x27;).addEventListener(&#x27;submit&#x27;, (event) =&gt; {
        event.preventDefault();
        const input = root.querySelector(&#x27;#sf-command-input&#x27;);
        if (!input.value.trim()) { input.focus(); return; }
        showToast(&#x27;指令已交给撰写师&#x27;);
        input.value = &#x27;&#x27;;
      });

      root.querySelectorAll(&#x27;[data-collab]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;[data-collab]&#x27;).forEach((item) =&gt; { const active = item === button; item.classList.toggle(&#x27;is-active&#x27;, active); item.setAttribute(&#x27;aria-selected&#x27;, String(active)); });
        collabContent.innerHTML = button.dataset.collab === &#x27;context&#x27; ? &#x27;&lt;section class=&quot;sf-activity-item&quot;&gt;&lt;span class=&quot;sf-kicker&quot;&gt;本次写作上下文&lt;/span&gt;&lt;p&gt;Story Core v2 · Beat 02 · Character 林夏 v2 · 原著第 2–3 章 · 项目风格“克制悬疑”。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;sf-text-button&quot;&gt;管理上下文&lt;/button&gt;&lt;/section&gt;&#x27; : originalCollab;
        refreshIcons();
      }));

      root.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Escape&#x27;) {
          if (!diffDrawer.hidden) closeLayer(diffDrawer);
          else if (!createModal.hidden) closeLayer(createModal);
        }
      });

      refreshIcons();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
